[workspace]
members = [
    "fxsonic-dsp",
    "fxsonic-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FxSonic Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fxsonic/fxsonic"

[workspace.dependencies]
# Audio / PipeWire
pipewire = "0.9"
ladspa = "0.2"
libc = "0.2"

# DSP
fundsp = "0.18"
biquad = "0.4"
rustfft = "6"
dasp = "0.11"

# Core application
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Serialization
rmp-serde = "1"

# Configuration
directories = "5"
toml = "0.8"
regex = "1"
